project_id = "english-tales"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
enable_anonymous_sign_ins = false

[functions.delete-account]
# The handler verifies the token with Auth and checks the live, recent session.
verify_jwt = false

[functions.admob-ssv]
# Google calls without a Supabase token; the handler verifies Google's ECDSA signature.
verify_jwt = false

[functions.premium-sync]
# The handler verifies the user token with Auth itself.
verify_jwt = false

[functions.revenuecat-webhook]
# RevenueCat sends the configured Authorization value; the handler checks it.
verify_jwt = false
