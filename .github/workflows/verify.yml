name: Verify native release preparation
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python tooling/verify_repository.py
      - run: python tooling/verify_localization.py
      - run: python tooling/test_elf_alignment.py
      - run: python tooling/test_service_device_tests.py
      - run: python tooling/test_device_watchdog.py
      - run: python -m unittest discover -s tooling -p 'test_analytics_cli.py' -v
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native-android/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: native-android/backend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm test
      - run: npm run test:admin
      - run: npm run content:audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: content-audit
          path: native-android/build/content-audit/
          retention-days: 14
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :macrobenchmark:assemblePerformance
      - run: python3 ../tooling/verify_native_package.py app/build/outputs/apk/debug/app-debug.apk
      - name: Room schema is committed
        run: |
          # The build exports the Room schema; a database change must commit it.
          changed="$(git status --porcelain -- app/schemas)"
          if [ -n "$changed" ]; then
            echo "$changed"
            for f in $(git ls-files --others --modified -- app/schemas); do echo "::group::$f"; cat "$f"; echo "::endgroup::"; done
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-verification
          path: |
            native-android/app/build/reports/tests/
            native-android/app/build/reports/lint-results-debug.*
          retention-days: 14
  android-device:
    # Runs the instrumentation suite that was previously only executed locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Download emulator system image
        # The emulator runner downloads the image once and fails the job on a corrupt archive
        # ("Error on ZipFile unknown archive"). Fetch it here with retries; the runner then finds it installed.
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          image="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          yes | "$sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if "$sdkmanager" --install 'system-images;android-34;google_apis;x86_64' > /dev/null && [ -f "$image/system.img" ]; then
              exit 0
            fi
            echo "::warning::System image download failed (attempt $attempt of 3)"
            rm -rf "$image"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: native-android
          script: |
            python3 ../tooling/run_android_device_tests.py
            bash gradlew :macrobenchmark:connectedPerformanceAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yurken.englishtales.benchmark.StartupBenchmark -Pandroid.testInstrumentationRunnerArguments.performanceIterations=1 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-device-tests
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
            native-android/build/device-watchdog/
            native-android/macrobenchmark/build/reports/androidTests/
            native-android/macrobenchmark/build/outputs/androidTest-results/
            native-android/macrobenchmark/build/outputs/connected_android_test_additional_output/
          retention-days: 14
  android-service-device:
    # Explicit public-service probe; missing configuration and skipped tests fail this job.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PserviceDeviceTest=true
      - name: Download emulator system image
        # The emulator runner downloads the image once and fails the job on a corrupt archive
        # ("Error on ZipFile unknown archive"). Fetch it here with retries; the runner then finds it installed.
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          image="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          yes | "$sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if "$sdkmanager" --install 'system-images;android-34;google_apis;x86_64' > /dev/null && [ -f "$image/system.img" ]; then
              exit 0
            fi
            echo "::warning::System image download failed (attempt $attempt of 3)"
            rm -rf "$image"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: native-android
          script: |
            bash gradlew :app:connectedDebugAndroidTest -PserviceDeviceTest=true
      - name: Require all three service checks without skips
        if: always()
        run: python3 ../tooling/verify_service_device_tests.py app/build/outputs/androidTest-results/connected/debug --report build/service-device-tests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-service-device-tests
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
            native-android/build/service-device-tests.json
          retention-days: 14
