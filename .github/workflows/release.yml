name: Android release
# Builds a signed store package from a pushed commit, verifies it with
# tooling/verify_release.py and optionally uploads it to the Play internal track.
# Setup and required secrets: native-android/docs/RELEASE_AUTOMATION.md
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play version code; must be higher than every code in Play Console'
        required: true
        type: number
      version_name:
        description: 'Version name shown to users (empty keeps the Gradle default)'
        required: false
        type: string
      upload_to_internal:
        description: 'Upload to the Play internal track (master only)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Secrets live in this environment so required reviewers can gate every run.
    environment: release
    defaults:
      run:
        working-directory: native-android
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Check inputs
        run: |
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] && (( VERSION_CODE > 48 )) || { echo "::error::version_code must be an integer above 48"; exit 1; }
          if [[ -n "$VERSION_NAME" && ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::version_name must look like 2.1.0"; exit 1; fi
          if [[ "${{ inputs.upload_to_internal }}" == "true" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Only master is uploaded to Play; run without upload for other branches"; exit 1
          fi
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # A store build never reuses or writes a shared build cache.
          cache-disabled: true
      - name: Restore private release files
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64; do
            [[ -n "${!name}" ]] || { echo "::error::Secret for $name is not configured in the release environment"; exit 1; }
          done
          umask 077
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$UPLOAD_STORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > signing.properties
      - name: Build signed APK and AAB
        run: |
          args=(-PreleaseVersionCode="$VERSION_CODE")
          [[ -n "$VERSION_NAME" ]] && args+=(-PreleaseVersionName="$VERSION_NAME")
          # Release builds also upload the R8 mapping to Crashlytics.
          bash gradlew :app:assembleRelease :app:bundleRelease "${args[@]}"
      - name: Verify release package
        run: python3 ../tooling/verify_release.py --sdk "$ANDROID_HOME" --jdk "$JAVA_HOME" --expected-version-code "$VERSION_CODE"
      - name: Summarize
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = json.loads(pathlib.Path('app/build/outputs/release-verification.json').read_text())
          print('### Android release candidate')
          print(f"- Commit: `{__import__('os').environ['GITHUB_SHA']}`")
          print(f"- Version: {report['versionCode']} / {report['versionName']}")
          print(f"- APK: {report['apkBytes'] / 1048576:.2f} MB, SHA-256 `{report['apkSHA256']}`")
          print(f"- AAB: {report['aabBytes'] / 1048576:.2f} MB, SHA-256 `{report['aabSHA256']}`")
          print(f"- Limitation: {report['limitation']}")
          EOF
      # Only the verification report is kept: the repository is public, and the
      # signed packages and R8 mapping go to Play and Crashlytics instead.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ inputs.version_code }}
          path: native-android/app/build/outputs/release-verification.json
          retention-days: 90
      - name: Upload to Play internal track
        if: inputs.upload_to_internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yurken.englishtales
          releaseFiles: native-android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: native-android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
      - name: Remove private release files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" signing.properties app/google-services.json
